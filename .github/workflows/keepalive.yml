name: keepalive
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: ping
        run: node ping.js
        continue-on-error: true
      - name: Guardar estado.json si cambio
        run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "estado de URLs" && git push)
      - name: Avisar si hay enlaces caidos
        if: steps.ping.outcome == 'failure'
        run: exit 1
